# NGINX Load Balancer config
# Place on the server sitting in front of prod1 / prod2
# or run as its own Docker container.

upstream star_predictor {
    least_conn;                    # route to least-busy server
    server prod1:8000 max_fails=3 fail_timeout=30s;
    server prod2:8000 max_fails=3 fail_timeout=30s;

    keepalive 32;                  # reuse connections for lower latency
}

server {
    listen 80;
    server_name _;

    # ── Proxy to FastAPI app ───────────────────────────────────────────
    location / {
        proxy_pass         http://star_predictor;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Timeouts — model inference can take a moment
        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;
    }

    # ── Health endpoint directly on NGINX (no upstream hit) ───────────
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
