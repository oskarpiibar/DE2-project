services:

  # ── Star Predictor App ────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: star-predictor:latest
    container_name: star_predictor_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Override these when deploying to prod
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://dev2:5000}
      - MLFLOW_MODEL_NAME=${MLFLOW_MODEL_NAME:-star_predictor}
      - MLFLOW_MODEL_STAGE=${MLFLOW_MODEL_STAGE:-Production}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
