services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: star-predictor:latest
    container_name: star_predictor_app
    restart: unless-stopped
    ports:
      - "8888:8000"
    volumes:
      # models/ is populated by the git hook on the dev server
      - ../models:/app/models:ro
    environment:
      - MODELS_DIR=/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  default:
    driver: bridge
