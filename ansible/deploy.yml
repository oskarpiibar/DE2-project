---
# ═══════════════════════════════════════════════════════════════
#  Star Predictor — Production Deployment Playbook
#  Run from the jump server:
#
#    ansible-playbook ansible/deploy.yml \
#      -i ansible/inventory.ini \
#      --extra-vars "github_pat=ghp_xxxx" --private-key {path_to_key}
#
# ═══════════════════════════════════════════════════════════════

- name: Deploy Star Predictor to production servers
  hosts: prod
  become: true

  vars:
    # Override via --extra-vars at runtime (never commit real values)
    github_pat:   "{{ github_pat }}"

    repo_url:     "https://oskarpiibar:{{ github_pat }}@github.com/oskarpiibar/DE2-project"
    repo_branch:      "main"
    app_dir:          "/home/ubuntu/DE2-project"
    app_src:          "{{ app_dir }}/src/app"
    app_name:         "star_predictor_app"

  tasks:

    # ── 1. Ensure Docker + Compose plugin are present ─────────────────
    - name: Install required apt packages
      apt:
        pkg:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - git
        state: latest
        update_cache: true

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu jammy stable"
        state: present

    - name: Install Docker CE and Compose plugin
      apt:
        pkg:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: latest
        update_cache: true

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    # ── 2. Pull / update the repo ──────────────────────────────────────
    - name: Clone or update repository
      git:
        repo:        "{{ repo_url }}"
        dest:        "{{ app_dir }}"
        version:     "{{ repo_branch }}"
        force:       true        # discard any local changes on the server
        accept_hostkey: true
      become_user: ubuntu
    
    - name: Copy best_model.pkl to src/app/models (at first deploy only)
      copy:
        src: "{{ app_dir }}/models/best_model.pkl"
        dest: "{{ app_src }}/models/best_model.pkl"
        owner: ubuntu
        group: ubuntu
        mode: '0644'
        force: false  # don't overwrite if it already exists in the app directory
      ignore_errors: true

    # ── 3. Build & (re)start the container ────────────────────────────
    - name: Build Docker image
      community.docker.docker_compose_v2:
        project_src: "{{ app_src }}"
        build:       always          # rebuild on every deploy to pick up code changes
        state:       present
      become_user: ubuntu
      environment:
        DOCKER_BUILDKIT: "1"

    - name: Restart app container (zero-downtime rolling)
      community.docker.docker_compose_v2:
        project_src:    "{{ app_src }}"
        state:          restarted
        remove_orphans: true
      become_user: ubuntu

    # ── 5. Health check ───────────────────────────────────────────────
    - name: Wait for app to be healthy
      uri:
        url:            "http://localhost:8000/health"
        return_content: true
        status_code:    200
      register:   health_result
      retries:    10
      delay:      6
      until:      health_result.status == 200

    - name: Print health status
      debug:
        msg: "{{ inventory_hostname }} — {{ health_result.content }}"

    # ── 6. Create model-receiver (githooks) ───────────────
    - name: Ensure model-receiver directory exists
      file:
        path: /home/ubuntu/model-receiver
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Initialize bare git repository
      command: git init --bare --initial-branch=main /home/ubuntu/model-receiver
      args:
        creates: /home/ubuntu/model-receiver/HEAD
      become_user: ubuntu

    - name: Create post-receive hook
      copy:
        dest: /home/ubuntu/model-receiver/hooks/post-receive
        owner: ubuntu
        group: ubuntu
        mode: '0755'
        content: |
          #!/bin/bash
          while read oldrev newrev ref
          do
            if [[ $ref =~ .*/main$ ]];
            then
              echo "Main ref received. Deploying main branch to production..."
              sudo git --work-tree=/home/ubuntu/DE2-project/src/app/models --git-dir=/home/ubuntu/model-receiver checkout -f
              docker restart {{ app_name }}
            else
              echo "Ref $ref successfully received. Doing nothing: only the main branch may be deployed on this server."
            fi
          done


- name: Deploy nginx load balancer
  hosts: prod1
  become: true

  vars:
    backend_servers: "{{ groups['prod'] }}"

  tasks:

    - name: Ensure nginx config directory exists
      file: 
        path: /opt/nginx
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Create nginx config
      copy:
        dest: /opt/nginx/nginx.conf
        content: |
          events {}

          http {
              upstream backend {
              {% for host in backend_servers %}
                  server {{ hostvars[host]['ansible_host'] }}:8000;
              {% endfor %}
              }

              server {
                  listen 80;

                  location / {
                      proxy_pass http://backend;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  }
              }
          }

    - name: Run nginx container
      shell: |
        docker rm -f nginx-lb || true
        docker run -d \
          --name nginx-lb \
          -p 8888:80 \
          -v /opt/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
          nginx