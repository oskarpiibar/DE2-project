   - name: Create Ray log file
     file:
       path: /var/log/ray-head.log
       state: touch
       owner: ubuntu
       group: ubuntu
       mode: '0744'
     become: true

   - name: Start Ray head
     shell: |
       ray stop || true
       nohup /usr/local/bin/ray start --head --port=6379 --dashboard-host=0.0.0.0 > /var/log/ray-head.log 2>&1 &
     args:
       executable: /bin/bash
     become: true
     become_user: ubuntu

   - name: Wait for Ray head to be available
     wait_for:
       host: 127.0.0.1
       port: 6379
       state: started
       timeout: 120

- hosts: dev2

  tasks:

   - name: Install mlflow via pip
     pip:
       name: mlflow
       state: present
     become: true

   - name: Create mlflow directories
     file:
       path: /opt/mlflow/artifacts
       state: directory
       owner: ubuntu
       group: ubuntu
       mode: '0755'
     become: true

   - name: Ensure mlflow base dir
     file:
       path: /opt/mlflow
       state: directory
       owner: ubuntu
       group: ubuntu
       mode: '0755'
     become: true

   - name: Create Ray log file
     file:
       path: /var/log/ray-worker.log
       state: touch
       owner: ubuntu
       group: ubuntu
       mode: '0744'
     become: true

     # Add public IP if want to access dashboard from outside the VM
   - name: Create systemd service for Mlflow
     copy:
       dest: /etc/systemd/system/mlflow.service
       content: |
         [Unit]
         Description=MLflow server
         After=network.target

         [Service]
         User=ubuntu
         Group=ubuntu
         ExecStart=/usr/local/bin/mlflow server --host 0.0.0.0 --allowed-hosts="localhost:*,192.168.*" --cors-allowed-origins "*"  --port 5000 --backend-store-uri sqlite:////opt/mlflow/mlflow.db --serve-artifacts --artifacts-destination /opt/mlflow/artifacts
         Restart=always

         [Install]
         WantedBy=multi-user.target
     become: true

   - name: Reload systemd
     command: systemctl daemon-reload
     become: true

   - name: Enable and start mlflow
     systemd:
       name: mlflow.service
       enabled: yes
       state: started
     become: true

   - name: Start Ray worker
     shell: |
       ray stop || true
       ray start --address='{{ hostvars["dev1"]["ansible_host"] }}:6379'
     args:
       executable: /bin/bash
     become: true
     become_user: ubuntu

