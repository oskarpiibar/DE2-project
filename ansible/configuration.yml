- hosts: dev

  vars:
    # Override via --extra-vars at runtime (never commit real values)
    github_pat:   "{{ github_pat }}"

    repo_url:     "https://oskarpiibar:{{ github_pat }}@github.com/oskarpiibar/DE2-project"
    repo_branch:      "main"
    app_dir:          "/home/ubuntu/DE2-project"
    app_src:          "{{ app_dir }}/src/app"

  tasks:
   # first run always works, but on second (or further) run it will cause error since the file is already there
   # we can ignore by commenting out this task at second (or further) run 
   - name: Install python3-pip
     apt: pkg=python3-pip state=latest update_cache=true  
     become: true

   - name: Install ML tools and packages
     become: true
     pip: 
      name: 
        - ray[data,train,tune,serve]==2.55.1 
        - scikit-learn
        - numpy
        - pandas 
        - matplotlib 
        - seaborn
        - requests
      state: present
   
   - name: Clone or update repository
     git:
      repo:        "{{ repo_url }}"
      dest:        "{{ app_dir }}"
      version:     "{{ repo_branch }}"
      force:       false        # preserve local changes (if any) since this is a dev machine
      accept_hostkey: true
     become_user: ubuntu

   - name: Create git-hooks directory # for pushing best_model update to production
     file:  
       path: "/home/ubuntu/git-hooks"
       state: directory
       owner: ubuntu
       group: ubuntu
       mode: '0755'
  
   - name: Generate ssh key for pushing to production
     openssh_keypair:
       path: "/home/ubuntu/.ssh/id_rsa"
       type: rsa
       size: 2048
       owner: ubuntu
       group: ubuntu
       mode: '0600'
       force: true
     become_user: ubuntu

- hosts: dev1

  tasks:

   - name: Create Ray log file
     file:
       path: /var/log/ray-head.log
       state: touch
       owner: ubuntu
       group: ubuntu
       mode: '0744'
     become: true

   - name: Start Ray head
     shell: |
       ray stop || true
       nohup /usr/local/bin/ray start --head --port=6379 --dashboard-host=0.0.0.0 > /var/log/ray-head.log 2>&1 &
     args:
       executable: /bin/bash
     become: true
     become_user: ubuntu

   - name: Wait for Ray head to be available
     wait_for:
       host: 127.0.0.1
       port: 6379
       state: started
       timeout: 120

